services:
  windows:
    image: dockurr/windows
    container_name: windows11
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"
      CPU_CORES: "4"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389
    volumes:
      - /var/win11:/storage:Z
    # unless-stopped, not always: a 4GB Windows VM auto-starting at every boot
    # hurts boot time and drains laptop batteries. Start it explicitly with
    # `docker compose up -d` when needed.
    restart: unless-stopped
    stop_grace_period: 2m

