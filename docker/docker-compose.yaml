version: '3'
services:
  windows:
    image: dockurr/windows
    container_name: windows11
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"
      CPU_CORES: "4"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389
    volumes:
      - /var/win11:/storage:Z
    restart: always
    stop_grace_period: 2m

